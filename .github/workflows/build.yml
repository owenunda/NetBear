name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test

      - name: Version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0' }
          "NETBEAR_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish (Native AOT)
        run: dotnet publish src/NetBear/NetBear.csproj -c Release -r win-x64 -o artifacts/publish -p:Version=${{ env.NETBEAR_VERSION }}

      # Paquete para Microsoft Store: va sin firmar, la Store lo firma al publicarlo.
      - name: MSIX
        shell: pwsh
        run: |
          $stage = 'artifacts/msix'
          New-Item -ItemType Directory -Force "$stage/Assets" | Out-Null
          Copy-Item packaging/msix/Assets/* "$stage/Assets"
          Copy-Item artifacts/publish/NetBear.exe $stage
          (Get-Content packaging/msix/AppxManifest.xml -Raw).Replace('$version$', "$env:NETBEAR_VERSION.0") |
            Set-Content "$stage/AppxManifest.xml" -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe no encontrado" }
          & $makeappx.FullName pack /d $stage /p artifacts/NetBear.msix /o
          if ($LASTEXITCODE) { throw "makeappx falló ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        with:
          name: NetBear-msix
          path: artifacts/NetBear.msix

      - name: Portable zip
        if: github.ref_type == 'tag'
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/NetBear.exe -DestinationPath artifacts/NetBear-portable.zip

      - name: Installer
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress --version 6.4.3
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe no encontrado" }
          & $iscc installer/NetBear.iss

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/NetBearSetup.exe
            artifacts/NetBear-portable.zip
            artifacts/NetBear.msix
